# act-runner.yaml
# Gitea's Actions runner, registered against your own Gitea instance.
# Get a registration token from: Gitea admin panel -> Actions -> Runners -> Create new runner
# Then: kubectl create secret generic act-runner-token \
#         --from-literal=token=<TOKEN> -n gitea

apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: gitea
spec:
  replicas: 4
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
    spec:
      # Runner executes arbitrary CI code from anyone who can push to a repo
      # or open a PR against one; no reason it also needs k8s API access.
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: gitea/act_runner:latest
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-token
                  key: token
            - name: GITEA_RUNNER_NAME
              # Unique per pod (act_runner_1, act_runner_2, ...) so 4
              # replicas don't all register under the identical display
              # name "k3s-runner-1" — each still gets its own runner
              # UUID/secret regardless, but distinct names make the
              # admin Actions -> Runners list legible.
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Docker-in-Docker socket for running job containers.
            # Simpler than rootless DinD for a single-node setup; tighten later if needed.
            - name: DOCKER_HOST
              value: "tcp://docker-dind:2375"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# Sidecar-style DinD service the runner talks to for executing job containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-dind
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-dind
  template:
    metadata:
      labels:
        app: docker-dind
    spec:
      # Already privileged; don't hand it k8s API access on top of that.
      automountServiceAccountToken: false
      containers:
        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - containerPort: 2375
          resources:
            # These bound the dind daemon process itself, not the job
            # containers it spawns inside — those run as siblings on the
            # node and aren't constrained by this pod's cgroup. On a small
            # single-node box, watch actual node memory under CI load.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docker-dind
  namespace: gitea
spec:
  # Headless: a normal ClusterIP only forwards the ports declared below
  # (2375). testcontainers-go (used by integration/e2e in variance) has dind
  # publish its ryuk reaper — and every container under test — on random
  # ephemeral host ports, then dials them directly at this Service's address;
  # against a ClusterIP those dials silently time out since the port was
  # never declared. clusterIP: None makes DNS resolve straight to the pod IP
  # instead, so the flat pod network carries any port through untouched.
  clusterIP: None
  selector:
    app: docker-dind
  ports:
    - port: 2375
      targetPort: 2375
