# act-runner.yaml
# Gitea's Actions runner, registered against your own Gitea instance.
# Get a registration token from: Gitea admin panel -> Actions -> Runners -> Create new runner
# Then: kubectl create secret generic act-runner-token \
#         --from-literal=token=<TOKEN> -n gitea

apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
    spec:
      containers:
        - name: runner
          image: gitea/act_runner:latest
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-token
                  key: token
            - name: GITEA_RUNNER_NAME
              value: "k3s-runner-1"
            # Docker-in-Docker socket for running job containers.
            # Simpler than rootless DinD for a single-node setup; tighten later if needed.
            - name: DOCKER_HOST
              value: "tcp://docker-dind:2375"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# Sidecar-style DinD service the runner talks to for executing job containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-dind
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-dind
  template:
    metadata:
      labels:
        app: docker-dind
    spec:
      containers:
        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - containerPort: 2375
---
apiVersion: v1
kind: Service
metadata:
  name: docker-dind
  namespace: gitea
spec:
  selector:
    app: docker-dind
  ports:
    - port: 2375
      targetPort: 2375
