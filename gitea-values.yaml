# values.yaml for gitea-charts/gitea
# Full install steps (including the secrets.local.yaml overlay this depends
# on): see SETUP.md. Don't repeat the install command here too — it's what
# went stale last time and caused a real install to run without secrets.

replicaCount: 1

# --- Persistence: repos, LFS, avatars, etc ---
persistence:
  enabled: true
  size: 40Gi
  storageClass: "local-path"   # k3s default provisioner, fine for single node
  accessModes:
    - ReadWriteOnce

# --- Postgres, run in-cluster since Hetzner has no managed DB ---
postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        username: gitea
        # No password here. Leaving it unset makes the subchart generate a
        # strong random one itself, stored in the `gitea-postgresql` Secret
        # (key: password) — nothing else in this repo needs to know it by
        # hand: the backup job and DR steps read it from that Secret directly.
        # Only set one here (via secrets.local.yaml, never this file) if you
        # specifically need a password you can predict, e.g. for an external
        # tool that can't read cluster Secrets.
        database: gitea
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "local-path"

# The chart enables postgresql-ha by default; it must be explicitly turned
# off or install fails with "Only one of postgresql or postgresql-ha can be
# enabled at the same time."
postgresql-ha:
  enabled: false

# --- Redis for queues/sessions (optional but recommended over SQLite-backed queues) ---
redis-cluster:
  enabled: false   # skip for single-node; Gitea will use built-in memory/level queues instead

gitea:
  admin:
    username: "gitea_admin"
    # password and email: set only in secrets.local.yaml, never here. The
    # chart only creates this admin user at all if both username and
    # password are set — leave password unset (e.g. no secrets.local.yaml
    # supplied) and no admin bootstraps, rather than one with a known,
    # committed placeholder password.
  config:
    server:
      # Replace <SERVER_IP> with your Hetzner server's public IP, e.g. 203.0.113.5
      # sslip.io resolves this hostname to that IP automatically — no DNS setup needed.
      DOMAIN: "git.<SERVER_IP>.sslip.io"
      ROOT_URL: "https://git.<SERVER_IP>.sslip.io/"
      SSH_DOMAIN: "git.<SERVER_IP>.sslip.io"
    service:
      # Self-hosted single-admin instance — no open signups. Add users via
      # the admin panel/CLI instead: gitea admin user create.
      DISABLE_REGISTRATION: true
    database:
      DB_TYPE: postgres
    session:
      PROVIDER: db
    queue:
      TYPE: level
    cache:
      ADAPTER: memory
    # Enable Gitea Actions (built-in CI, compatible with GH Actions YAML)
    actions:
      ENABLED: true

# --- Ingress: point this at your own ingress controller / cert-manager setup ---
ingress:
  enabled: true
  className: "traefik"   # k3s ships with Traefik by default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    # Replace <SERVER_IP> with your Hetzner server's public IP, e.g. 203.0.113.5
    - host: git.<SERVER_IP>.sslip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - git.<SERVER_IP>.sslip.io

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
