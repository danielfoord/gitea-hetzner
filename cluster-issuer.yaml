# cluster-issuer.yaml
# Requires cert-manager to be installed first:
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true
#
# Uses HTTP-01 challenge, which works fine with sslip.io since the hostname
# resolves to your server and Let's Encrypt just needs to reach it over HTTP
# on port 80 to validate ownership — no DNS API integration needed.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "your-email@example.com"   # replace with a real email for expiry notices
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
